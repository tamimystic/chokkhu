[flake8]
max-line-length = 160
extend-ignore = E203, W503, E402
per-file-ignores =
    __init__.py: F401, F403, E402, F811
    */__init__.py: F401, F403, E402, F811
    */**/__init__.py: F401, F403, E402, F811
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    venv,
    .venv

[isort]
profile = black
line_length = 88
known_first_party = chokkhu
src_paths = src
