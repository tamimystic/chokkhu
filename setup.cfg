[flake8]
max-line-length = 160
extend-ignore = E203, W503, E402
per-file-ignores =
    __init__.py: F401, F403, E402, F811
    */__init__.py: F401, F403, E402, F811
    */**/__init__.py: F401, F403, E402, F811
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    venv,
    .venv

[isort]
profile = black
line_length = 88
known_first_party = chokkhu
src_paths = src

[mypy]
mypy_path = src
ignore_missing_imports = True
follow_imports = skip
strict_optional = False
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
warn_unused_ignores = False
